<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing — Kenzo Spaulding</title>
    <meta name="description" content="Writing by Kenzo Spaulding about company building, 0-to-1 work, AI, infrastructure, and software engineering.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://kzs0.dev/blog/">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .blog-header {
            padding: 6rem 0 4rem;
            border-bottom: 1px solid var(--border);
        }

        .blog-title {
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }

        .blog-subtitle {
            font-size: 1.0625rem;
            font-weight: 300;
            color: var(--text-secondary);
        }

        .posts {
            padding: 3rem 0;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .post-item {
            display: flex;
            flex-direction: column;
            padding: 1.75rem 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .post-item:first-child {
            border-top: 1px solid var(--border);
        }

        .post-item:hover {
            padding-left: 1rem;
            background: linear-gradient(90deg, var(--bg-secondary) 0%, transparent 100%);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.625rem;
        }

        .post-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            letter-spacing: 0.02em;
        }

        .post-tag {
            font-size: 0.6875rem;
            font-weight: 500;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.5rem;
            background: var(--accent-muted);
            border-radius: 3px;
        }

        .post-title {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .post-excerpt {
            font-size: 0.9375rem;
            font-weight: 300;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
        }

        .empty-state {
            text-align: center;
            padding: 6rem 2rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1rem;
            color: var(--text-tertiary);
        }

        @media (max-width: 768px) {
            .blog-header {
                padding: 5rem 0 3rem;
            }

            .post-item:hover {
                padding-left: 0.5rem;
            }
        }

        /* Slide-up fade-in animations */
        .blog-title,
        .blog-subtitle {
            animation: slideUpFadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .blog-title {
            animation-delay: 0.2s;
        }

        .blog-subtitle {
            animation-delay: 0.4s;
        }

        .post-item {
            animation: slideUpFadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .post-item:nth-child(1) { animation-delay: 0.5s; }
        .post-item:nth-child(2) { animation-delay: 0.65s; }
        .post-item:nth-child(3) { animation-delay: 0.8s; }
        .post-item:nth-child(4) { animation-delay: 0.95s; }
        .post-item:nth-child(5) { animation-delay: 1.1s; }
    </style>
</head>
<body>
    <div id="vanta-bg" aria-hidden="true"></div>
    <nav class="nav">
        <div class="nav-left">
            <a href="/" class="nav-logo">Kenzo Spaulding <span class="nav-alias">kzs0</span></a>
        </div>
        <div class="nav-right">
            <a href="/blog" class="nav-link" style="color: var(--text-primary);">Writing</a>
            <a href="/bedrock" class="nav-link">Bedrock</a>
        </div>
    </nav>

    <main class="main">
        <header class="blog-header">
            <h1 class="blog-title">Writing</h1>
            <p class="blog-subtitle">Company building, going from 0 to 1, AI, and software engineering.</p>
        </header>

        <section class="posts">
            <div class="empty-state">
                <p class="empty-state-text">Nothing published yet. This will be the place for longer notes from the work.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span class="footer-text">© 2026 Kenzo Spaulding · kzs0</span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.topology.min.js"></script>
    <script src="../main.js"></script>
</body>
</html>
